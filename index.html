<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cairn</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/marked@14.1.3/marked.min.js"></script>
  <script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>

  <!-- Left panel: design tools (hidden in display mode) -->
  <aside id="tools-panel" class="panel panel-left hidden">
    <div class="panel-header">Tools</div>

    <div class="tool-group">
      <label class="field-label" for="project-title">Map</label>
      <input id="project-title" type="text" class="field-input" placeholder="Untitled map" maxlength="200" />
      <div class="tool-row">
        <button id="project-export" class="tool-btn" title="Download this map (annotations + image) as a .imap.json file">
          <i data-lucide="download"></i> Export
        </button>
        <button id="project-import" class="tool-btn" title="Open a .imap.json map file (or drop one on the map)">
          <i data-lucide="folder-open"></i> Import
        </button>
      </div>
      <input type="file" id="project-input" accept=".json,application/json" hidden />
      <div id="link-notice" class="link-notice hidden">
        Opened from a link: changes aren't saved.
        <button id="keep-map" class="btn-link">Keep as my map</button>
      </div>
      <div id="project-status" class="wand-status"></div>
    </div>

    <div class="tool-group">
      <button id="tool-upload" class="tool-btn" title="Upload map image">
        <i data-lucide="upload"></i> Upload Image
      </button>
      <input type="file" id="upload-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
    </div>

    <div class="tool-group">
      <button id="tool-pin" class="tool-btn" title="Place a pin">
        <i data-lucide="map-pin"></i> Add Pin
      </button>
    </div>

    <div class="tool-group">
      <button id="tool-region" class="tool-btn" title="Draw a region polygon">
        <i data-lucide="box-select"></i> Add Region
      </button>
      <button id="tool-wand" class="tool-btn" title="Flood-fill a region from a click">
        <i data-lucide="wand-2"></i> Flood Region
      </button>
      <button id="tool-edit" class="tool-btn" title="Edit vertices of selected region">
        <i data-lucide="pen-tool"></i> Edit Vertices
      </button>
    </div>

    <div class="tool-group">
      <button id="tool-brush" class="tool-btn" title="Paint brush — drag to add to selected region">
        <i data-lucide="paintbrush"></i> Brush
      </button>
      <button id="tool-eraser" class="tool-btn" title="Eraser — drag to subtract from regions">
        <i data-lucide="eraser"></i> Eraser
      </button>
    </div>

    <div class="tool-group hidden" id="wand-options">
      <label class="field-label">Tolerance <span id="wand-tolerance-val">30</span></label>
      <input id="wand-tolerance" type="range" min="1" max="120" value="30" class="field-range" />
      <div id="wand-status" class="wand-status"></div>
      <button id="wand-cancel" class="btn-danger hidden">Cancel</button>
    </div>

    <div class="tool-group hidden" id="brush-controls">
      <label class="field-label">Brush size <span id="brush-size-val">30</span>px</label>
      <input id="brush-size" type="range" min="5" max="150" value="30" class="field-range" />
    </div>

    <div class="tool-group">
      <label class="field-toggle" title="Ask for a second Backspace / click before deleting">
        <input type="checkbox" id="confirm-deletes" checked /> Confirm deletes
      </label>
    </div>

    <!-- Future tool groups (filtering, etc.) will slot in here -->
  </aside>

  <!-- Main map canvas -->
  <main id="map-container">
    <div id="map"></div>

    <!-- Layer strip (top-left corner of map) -->
    <div id="layer-strip">
      <div id="layer-chips"></div>
      <button id="layer-add" title="Add layer">+</button>
    </div>

    <!-- Mode toggle + share (top-right corner of map) -->
    <div id="mode-toggle">
      <div>
        <button id="btn-mode">Switch to Design Mode</button>
        <button id="btn-share" title="Get a share link">Share</button>
      </div>
      <div id="share-dialog" class="hidden">
        <div class="share-section-title">Link to a map file</div>
        <input id="share-file-src" type="text" placeholder="https://gist.github.com/you/abc123…" />
        <div class="share-url-row">
          <input id="share-file-url" type="text" readonly />
          <button id="share-file-copy" disabled>Copy</button>
        </div>
        <label class="share-lock-label">
          <input type="checkbox" id="share-file-edit" /> Let viewers edit
        </label>
        <p id="share-file-note" class="share-note"></p>

        <div class="share-section-title">Quick link (annotations only, no image)</div>
        <label class="share-lock-label">
          <input type="checkbox" id="share-lock" /> Lock Design Mode for viewer
        </label>
        <div class="share-url-row">
          <input id="share-url" type="text" readonly />
          <button id="share-copy">Copy</button>
        </div>
        <p id="share-note" class="share-note"></p>
      </div>
    </div>

    <!-- Messages about the map as a whole (loading / errors for linked maps) -->
    <div id="map-banner" class="map-banner hidden"></div>

    <!-- Placeholder shown when no image is loaded -->
    <div id="map-placeholder">
      <p>No map loaded.<br/>Switch to Design Mode and upload an image.</p>
    </div>
  </main>

  <!-- Confirmation for actions that replace the current map -->
  <dialog id="confirm-dialog" class="confirm-dialog">
    <h3 class="dialog-title"></h3>
    <p class="dialog-message"></p>
    <div class="dialog-buttons"></div>
  </dialog>

  <!-- Right panel: annotation details -->
  <aside id="detail-panel" class="panel panel-right hidden">
    <div class="panel-header">Details</div>
    <div id="detail-tree" class="hidden"></div>
    <div id="detail-content">
      <p class="detail-empty">Click a region or pin to see details.</p>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/polygon-clipping@0.15.7/dist/polygon-clipping.umd.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
